name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'etapa-*/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests (CPM/PERT, API, tarefas, IFC, migração de dados)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (unit, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies (serviço usado pelos testes e2e)
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests and demo schedule engine tests
        working-directory: frontend
        run: npm test
      - name: Type check and production build
        working-directory: frontend
        run: npm run build
      - name: Build GitHub Pages site (demonstração)
        working-directory: frontend
        run: npm run build:pages
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (frontend + serviço real)
        working-directory: frontend
        env:
          BIM_SCHEDULE_PYTHON: python
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
